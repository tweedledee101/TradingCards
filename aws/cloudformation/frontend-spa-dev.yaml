AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Ragnarok Gaming — Dev SPA at dev.<domain> (separate S3 + CloudFront from production).
  ACM certificate in us-east-1 must include dev.ragnarokgamez.com (or a wildcard *.ragnarokgamez.com).

Parameters:
  DomainName:
    Type: String
    Default: ragnarokgamez.com
    Description: Apex zone name; hostname will be dev.<DomainName>

  HostedZoneId:
    Type: String
    Description: Route53 hosted zone ID for DomainName (no /hostedzone/ prefix)

  AcmCertificateArn:
    Type: String
    Description: ACM cert ARN in us-east-1 that covers dev.<DomainName>

Resources:
  DevSiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ragnarok-spa-dev-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  DevOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        Description: OAC for dev SPA bucket
        SigningBehavior: always
        SigningProtocol: sigv4
        OriginAccessControlOriginType: s3

  DevSiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DevSiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${DevSiteBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub
                  - 'arn:aws:cloudfront::${Account}:distribution/${DistId}'
                  - Account: !Ref 'AWS::AccountId'
                    DistId: !Ref DevCloudFrontDistribution

  DevCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Comment: Ragnarok Gaming SPA (dev)
        DefaultRootObject: index.html
        Aliases:
          - !Sub 'dev.${DomainName}'
        Origins:
          - Id: S3DevOrigin
            DomainName: !GetAtt DevSiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt DevOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3DevOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  DnsRecordDev:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'dev.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt DevCloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  BucketName:
    Description: Upload Vite build (npm run build:dev) here
    Value: !Ref DevSiteBucket
  CloudFrontDistributionId:
    Value: !Ref DevCloudFrontDistribution
  CloudFrontDomainName:
    Value: !GetAtt DevCloudFrontDistribution.DomainName
  DevSiteUrl:
    Description: Dev UI URL
    Value: !Sub 'https://dev.${DomainName}'
