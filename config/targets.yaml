# Schedule Configuration
schedule:
  # When to run daily imports (24-hour format)
  daily_import_time: "02:00"  # 2 AM
  
  # How many days back to search
  days_back: 7
  
  # Enable/disable specific tasks
  import_sales: true
  import_listings: true
  calculate_trends: true
  generate_reports: true

# Report Configuration
reports:
  # Where to save daily reports
  output_dir: "reports"
  
  # Top N cards to include
  top_cards_limit: 25
  
  # Email notifications (optional)
  email_enabled: false
  email_to: "your-email@example.com"
