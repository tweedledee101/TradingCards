[pytest]
# pytest-cov pulls in coverage → sqlite3; some /usr/local or minimal Pythons lack _sqlite3.
# Opt in to coverage: ./run_tests.sh coverage, or pytest -p pytest_cov --cov=...
addopts = -p no:pytest_cov
testpaths = tests
pythonpath = .
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (requires database)
    qa: QA regression tests (bugs that were found manually)
