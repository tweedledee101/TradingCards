name: Auction Pipeline

on:
  schedule:
    - cron: '0 9,21 * * *'   # 9 AM + 9 PM UTC (5 AM + 5 PM ET) -- offset from BIN
  workflow_dispatch:
    inputs:
      hours:
        description: 'Auctions ending within X hours'
        required: false
        default: '48'
      max_budget:
        description: 'Max bid + shipping'
        required: false
        default: '200'
      min_profit:
        description: 'Min profit after all costs'
        required: false
        default: '10'
      years:
        description: 'Years to search (comma-separated)'
        required: false
        default: '2023,2024,2025,2026'
      sport:
        description: 'Sport to search'
        required: false
        default: 'baseball'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install selenium

      - name: Install Firefox + geckodriver
        run: |
          sudo add-apt-repository -y ppa:mozillateam/ppa
          sudo apt-get update
          sudo apt-get install -y firefox-esr
          GECKO_VER=$(curl -s https://api.github.com/repos/mozilla/geckodriver/releases/latest | grep tag_name | cut -d '"' -f 4)
          curl -sL "https://github.com/mozilla/geckodriver/releases/download/${GECKO_VER}/geckodriver-${GECKO_VER}-linux64.tar.gz" | tar xz
          sudo mv geckodriver /usr/local/bin/
          geckodriver --version
          firefox-esr --version

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 migrate.py --rds

      - name: Run auction pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_APP_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          python3 find_auction_opportunities.py \
            --hours ${{ inputs.hours }} \
            --max-budget ${{ inputs.max_budget }} \
            --min-profit ${{ inputs.min_profit }} \
            --years "${{ inputs.years }}" \
            --sport "${{ inputs.sport }}"
