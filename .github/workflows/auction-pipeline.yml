name: Auction Pipeline

on:
  # 1x/day standalone auction run.
  # Liquid-first: queries built from SCP cache, no Browse discovery needed.
  schedule:
    - cron: '30 7 * * *'   # 7:30 AM UTC (right after quota reset at 7 AM UTC / midnight Pacific)
  workflow_dispatch:
    inputs:
      hours:
        description: 'Auctions ending within X hours'
        required: false
        default: '168'
      max_budget:
        description: 'Max bid + shipping'
        required: false
        default: '200'
      min_profit:
        description: 'Min profit after all costs'
        required: false
        default: '10'
      years:
        description: 'Years to search (comma-separated)'
        required: false
        default: '2023,2024,2025,2026'
      sport:
        description: 'Sport to search (baseball, basketball, football, all)'
        required: false
        default: 'baseball'
      no_broad:
        description: 'Skip broad sweep queries (liquid-only)'
        type: boolean
        required: false
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install selenium

      - name: Install Firefox + geckodriver
        run: |
          sudo add-apt-repository -y ppa:mozillateam/ppa
          sudo apt-get update
          sudo apt-get install -y firefox-esr
          GECKO_VER="v0.36.0"
          curl -sL -o geckodriver.tar.gz "https://github.com/mozilla/geckodriver/releases/download/${GECKO_VER}/geckodriver-${GECKO_VER}-linux64.tar.gz"
          file geckodriver.tar.gz
          tar xzf geckodriver.tar.gz
          sudo mv geckodriver /usr/local/bin/
          rm geckodriver.tar.gz
          geckodriver --version
          firefox-esr --version

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 migrate.py --rds

      - name: Run auction pipeline (liquid-first)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_APP_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CLIENT_SECRET }}
          SCP_PAGE_LOAD_TIMEOUT: "90"
        # Liquid-first: queries come from scp_cache (cards with known volume).
        # No Browse discovery needed. No --players needed.
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.no_broad }}" = "true" ]; then
            EXTRA_ARGS="--no-product-line-queries --sold-comp-seed-queries 0"
          fi
          python3 find_auction_opportunities.py \
            --hours "${{ inputs.hours || '168' }}" \
            --max-budget "${{ inputs.max_budget || '200' }}" \
            --min-profit "${{ inputs.min_profit || '10' }}" \
            --years "${{ inputs.years || '2023,2024,2025,2026' }}" \
            --sport "${{ inputs.sport || 'baseball' }}" \
            $EXTRA_ARGS
