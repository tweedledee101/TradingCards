name: Auction Pipeline

on:
  # 2x/day standalone auction runs offset from pipeline.yml.
  # 7-day window captures most auctions; runs find newly listed ones.
  schedule:
    - cron: '0 12,0 * * *'   # 12 PM + 12 AM UTC (8 AM + 8 PM ET)
  workflow_dispatch:
    inputs:
      hours:
        description: 'Auctions ending within X hours'
        required: false
        default: '48'
      max_budget:
        description: 'Max bid + shipping'
        required: false
        default: '200'
      min_profit:
        description: 'Min profit after all costs'
        required: false
        default: '10'
      years:
        description: 'Years to search (comma-separated)'
        required: false
        default: '2023,2024,2025,2026'
      sport:
        description: 'Sport to search (baseball, basketball, football, all)'
        required: false
        default: 'baseball'
      dynamic_seed_limit:
        description: 'Merge top N players from DB sales into discovery (0=off)'
        required: false
        default: '50'
      dynamic_seed_days:
        description: 'Lookback days when ranking players from sales table'
        required: false
        default: '30'
      max_discovery_candidates:
        description: 'Max Browse discovery calls before ranking seeds'
        required: false
        default: '100'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install selenium

      - name: Install Firefox + geckodriver
        run: |
          sudo add-apt-repository -y ppa:mozillateam/ppa
          sudo apt-get update
          sudo apt-get install -y firefox-esr
          # geckodriver (pinned version to avoid GitHub API rate limits)
          GECKO_VER="v0.36.0"
          curl -sL -o geckodriver.tar.gz "https://github.com/mozilla/geckodriver/releases/download/${GECKO_VER}/geckodriver-${GECKO_VER}-linux64.tar.gz"
          file geckodriver.tar.gz
          tar xzf geckodriver.tar.gz
          sudo mv geckodriver /usr/local/bin/
          rm geckodriver.tar.gz
          geckodriver --version
          firefox-esr --version

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 migrate.py --rds

      - name: Run auction pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_APP_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CLIENT_SECRET }}
          SCP_PAGE_LOAD_TIMEOUT: "90"
        # inputs.* is empty on schedule(); use || defaults here — not bash ${VAR:-x} (fragile in GHA).
        run: |
          python3 find_auction_opportunities.py \
            --hours "${{ inputs.hours || '168' }}" \
            --max-budget "${{ inputs.max_budget || '200' }}" \
            --min-profit "${{ inputs.min_profit || '10' }}" \
            --years "${{ inputs.years || '2023,2024,2025,2026' }}" \
            --sport "${{ inputs.sport || 'baseball' }}" \
            --dynamic-seed-limit "${{ inputs.dynamic_seed_limit || '50' }}" \
            --dynamic-seed-days "${{ inputs.dynamic_seed_days || '30' }}" \
            --max-discovery-candidates "${{ inputs.max_discovery_candidates || '100' }}"
