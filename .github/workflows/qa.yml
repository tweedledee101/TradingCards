name: QA Pipeline

on:
  push:
    branches: [main, qa/*, feature/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: trading_cards_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: trading_cards_test
      DB_USER: postgres
      DB_PASSWORD: testpass
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/trading_cards_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install httpx  # for FastAPI test client

      - name: Set up database schema
        run: |
          PGPASSWORD=testpass psql -h localhost -U postgres -d trading_cards_test -f backend/models/schema.sql

      - name: Apply migrations
        run: python3 migrate.py

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short -x

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short -x

      - name: Run QA tests (bug regression)
        run: pytest tests/qa/ -v --tb=short

      - name: Test summary
        if: always()
        run: pytest tests/ -v --tb=line -q 2>&1 | tail -20

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Report bundle size
        working-directory: frontend
        run: |
          echo "=== Bundle Size ==="
          du -sh dist/
          echo ""
          echo "=== JS Chunks ==="
          find dist/assets -name '*.js' -exec du -h {} \; | sort -rh
          echo ""
          echo "=== CSS ==="
          find dist/assets -name '*.css' -exec du -h {} \; | sort -rh
          echo ""
          TOTAL_JS=$(find dist/assets -name '*.js' -exec cat {} + | wc -c)
          echo "Total JS: $(echo "scale=1; $TOTAL_JS/1024" | bc)KB"
          if [ $TOTAL_JS -gt 512000 ]; then
            echo "WARNING: JS bundle exceeds 500KB threshold"
          fi

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true
