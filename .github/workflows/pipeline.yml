name: Opportunity Pipeline

on:
  schedule:
    - cron: '0 6,18 * * *'   # 6 AM + 6 PM UTC (2 AM + 2 PM ET)
  workflow_dispatch:
    inputs:
      players:
        description: 'Comma-separated player names (blank = top 40 by volume)'
        required: false
        default: ''
      max_budget:
        description: 'Max buy price'
        required: false
        default: '200'
      min_profit:
        description: 'Min profit after fees'
        required: false
        default: '10'
      min_roi:
        description: 'Min ROI %'
        required: false
        default: '20'
      min_scp_price:
        description: 'Min SCP price to consider'
        required: false
        default: '5'
      max_scp_price:
        description: 'Max SCP price'
        required: false
        default: '1000'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install selenium

      - name: Install Firefox + geckodriver
        run: |
          sudo add-apt-repository -y ppa:mozillateam/ppa
          sudo apt-get update
          sudo apt-get install -y firefox-esr
          # geckodriver (pinned version to avoid GitHub API rate limits)
          GECKO_VER="v0.36.0"
          curl -sL -o geckodriver.tar.gz "https://github.com/mozilla/geckodriver/releases/download/${GECKO_VER}/geckodriver-${GECKO_VER}-linux64.tar.gz"
          file geckodriver.tar.gz
          tar xzf geckodriver.tar.gz
          sudo mv geckodriver /usr/local/bin/
          rm geckodriver.tar.gz
          geckodriver --version
          firefox-esr --version

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 migrate.py --rds

      - name: Run opportunity pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_APP_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CLIENT_SECRET }}
        # inputs.* is empty on schedule(); defaults must be in ${{ }}, not bash ${VAR:-x}.
        run: |
          ARGS=(
            python3 find_opportunities.py
            --max-budget "${{ inputs.max_budget || '200' }}"
            --min-profit "${{ inputs.min_profit || '10' }}"
            --min-roi "${{ inputs.min_roi || '20' }}"
            --min-scp-price "${{ inputs.min_scp_price || '5' }}"
            --max-scp-price "${{ inputs.max_scp_price || '1000' }}"
          )
          if [ -n "${{ inputs.players }}" ]; then
            ARGS+=(--players "${{ inputs.players }}")
          fi
          "${ARGS[@]}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: /tmp/*.log
          retention-days: 7
