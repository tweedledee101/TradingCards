name: Opportunity Pipeline

# BIN: discover players → shard files → matrix of parallel runners (default 8 shards, max 4 concurrent).
# Each shard replaces BIN rows only for its players (--bin-replace-scope shard_players), so wall-clock
# stays bounded. Auction job still runs after all BIN shards finish (if: always).

on:
  schedule:
    - cron: '0 14,22 * * *'   # 2 PM + 10 PM UTC = 9 AM + 5 PM CT
  workflow_dispatch:
    inputs:
      players:
        description: 'Comma-separated player names (blank = discover top N by volume)'
        required: false
        default: ''
      top_players:
        description: 'Hot player count when players blank (discovery)'
        required: false
        default: '40'
      max_budget:
        description: 'Max buy price'
        required: false
        default: '200'
      min_profit:
        description: 'Min profit after fees'
        required: false
        default: '10'
      min_roi:
        description: 'Min ROI %'
        required: false
        default: '20'
      min_scp_price:
        description: 'Min SCP price to consider'
        required: false
        default: '5'
      max_scp_price:
        description: 'Max SCP price'
        required: false
        default: '1000'
      sport:
        description: 'Discovery sport (Baseball, Basketball, Football, all)'
        required: false
        default: 'Baseball'
      dynamic_seed_limit:
        description: 'Merge top N players from DB sales into discovery (0=off)'
        required: false
        default: '50'
      dynamic_seed_days:
        description: 'Lookback days when ranking players from sales table'
        required: false
        default: '30'
      max_discovery_candidates:
        description: 'Max Browse discovery calls before ranking seeds'
        required: false
        default: '100'
      run_auction:
        description: 'Run auction job after BIN (uncheck = BIN only)'
        type: boolean
        required: false
        default: true
      auction_hours:
        description: 'Auctions ending within X hours (auction job)'
        required: false
        default: '48'
      auction_years:
        description: 'Auction years (comma-separated)'
        required: false
        default: '2023,2024,2025,2026'
      auction_sport:
        description: 'Auction sport'
        required: false
        default: 'baseball'
      ebay_variation_cap:
        description: 'Max SCP lines to search on eBay per shard (default 300 to fit within 5K daily Browse quota).'
        required: false
        default: '500'

jobs:
  # Keep --shards 8 in sync with matrix.shard list below.
  bin-plan:
    name: BIN plan (shard players)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 migrate.py --rds

      - name: Write player shard files
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          # 120 Baseball players from SCP cache (2024+ cards with 5+ entries).
          # Includes hot rookies, prospects, and current stars most likely to have mispriced cards.
          DEFAULT_PLAYERS="Bobby Witt Jr.,Aaron Judge,Mike Trout,Paul Skenes,Elly De La Cruz,Juan Soto,Shohei Ohtani,Fernando Tatis Jr.,Julio Rodriguez,Mookie Betts,Ronald Acuna Jr.,James Wood,Corbin Carroll,Dylan Crews,Yoshinobu Yamamoto,Gunnar Henderson,Jackson Chourio,Freddie Freeman,Nick Kurtz,Junior Caminero,Roman Anthony,Evan Carter,Jackson Merrill,Derek Jeter,Adley Rutschman,Marcelo Mayer,Jackson Holliday,Ken Griffey Jr,Roki Sasaki,Jasson Dominguez,Jac Caglianone,Nick Gonzales,Wyatt Langford,Nolan Ryan,David Wright,Luisangel Acuna,Corey Seager,Matt Shaw,Jacob Wilson,Trea Turner,Colton Cowser,Travis Bazzana,Manny Machado,Charlie Condon,Ichiro Suzuki,Chipper Jones,Vladimir Guerrero Jr.,Brooks Lee,Cal Ripken Jr,Cal Raleigh,Coby Mayo,Alex Bregman,Masyn Winn,Ryan Clifford,Yordan Alvarez,Kristian Campbell,Brandon Lowe,Pete Crow-Armstrong,Giancarlo Stanton,Mike Piazza,Jacob Misiorowski,Kyle Tucker,Drew Gilbert,Eddie Murray,Rhett Lowder,Matt Chapman,Carson Benge,Hyeseong Kim,Jace Jung,Cody Bellinger,Tarik Skubal,Garrett Crochet,Kevin Alcantara,Nolan McLean,Pete Alonso,William Contreras,Bubba Chandler,Kumar Rocker,Hurston Waldrep,Chase Dollander,Dalton Rushing,Connor Norby,Mason Miller,Jackson Jobe,Zac Veen,Ben Rice,Royce Lewis,Hunter Greene,Ketel Marte,Christian Moore,Byron Buxton,Jordan Walker,Kyle Schwarber,Oneil Cruz,Frank Thomas,Spencer Strider,Bryce Harper,Bo Jackson,Clayton Kershaw,Jose Altuve,Gerrit Cole,Barry Larkin,Thomas Saggese,Rafael Devers,Anthony Volpe,Blake Snell,Dansby Swanson,Francisco Lindor,Jazz Chisholm Jr.,Pete Alonso,Zach Wheeler,Carson Williams,Enrique Bradfield Jr.,Colson Montgomery,Bryce Eldridge,Pablo Guerrero,Michael Helman,Jose Ramirez,Luis Castillo,Willson Contreras"
          PLAYERS="${{ inputs.players }}"
          if [ -z "$PLAYERS" ]; then
            PLAYERS="$DEFAULT_PLAYERS"
          fi
          python3 scripts/write_bin_player_shards.py \
            --shards 8 \
            --out-dir bin_shards/ \
            --players "$PLAYERS"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-shards
          path: bin_shards/
          retention-days: 2

  opportunity-bin:
    name: BIN shard ${{ matrix.shard }}
    needs: [bin-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - uses: actions/checkout@v4

      - name: Download shard list
        uses: actions/download-artifact@v4
        with:
          name: bin-shards
          path: bin_shards

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 migrate.py --rds

      - name: Run BIN pipeline (this shard only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_APP_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          SHARD_FILE="bin_shards/shard-${{ matrix.shard }}.txt"
          if [ ! -f "$SHARD_FILE" ]; then
            echo "missing $SHARD_FILE"; exit 1
          fi
          PLAYERS=$(cat "$SHARD_FILE")
          if [ -z "$PLAYERS" ]; then
            echo "empty shard ${{ matrix.shard }} — skipping"
            exit 0
          fi
          LOG=/tmp/opportunity_bin_shard_${{ matrix.shard }}.log
          ARGS=(
            python3 find_opportunities.py
            --skip-auction-chain
            --use-scp-cache
            --bin-replace-scope shard_players
            --players "$PLAYERS"
            --max-budget "${{ inputs.max_budget || '200' }}"
            --min-profit "${{ inputs.min_profit || '10' }}"
            --min-roi "${{ inputs.min_roi || '20' }}"
            --min-scp-price "${{ inputs.min_scp_price || '5' }}"
            --max-scp-price "${{ inputs.max_scp_price || '1000' }}"
            --sport "${{ inputs.sport || 'Baseball' }}"
            --max-ebay-variations "${{ inputs.ebay_variation_cap || '500' }}"
          )
          "${ARGS[@]}" 2>&1 | tee "$LOG"

      - name: Upload BIN shard log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-bin-logs-shard-${{ matrix.shard }}
          path: /tmp/opportunity_bin_shard_${{ matrix.shard }}.log
          if-no-files-found: ignore
          retention-days: 7

  opportunity-auction:
    name: Auction (eBay-first)
    needs: [opportunity-bin]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.run_auction) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install selenium

      - name: Install Firefox + geckodriver
        run: |
          sudo add-apt-repository -y ppa:mozillateam/ppa
          sudo apt-get update
          sudo apt-get install -y firefox-esr
          GECKO_VER="v0.36.0"
          curl -sL -o geckodriver.tar.gz "https://github.com/mozilla/geckodriver/releases/download/${GECKO_VER}/geckodriver-${GECKO_VER}-linux64.tar.gz"
          file geckodriver.tar.gz
          tar xzf geckodriver.tar.gz
          sudo mv geckodriver /usr/local/bin/
          rm geckodriver.tar.gz
          geckodriver --version
          firefox-esr --version

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 migrate.py --rds

      - name: Run auction pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_APP_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CLIENT_SECRET }}
          SCP_PAGE_LOAD_TIMEOUT: "90"
        run: |
          set -o pipefail
          LOG=/tmp/opportunity_auction.log
          python3 find_auction_opportunities.py \
            --hours "${{ inputs.auction_hours || '168' }}" \
            --max-budget "${{ inputs.max_budget || '200' }}" \
            --min-profit "${{ inputs.min_profit || '10' }}" \
            --years "${{ inputs.auction_years || '2023,2024,2025,2026' }}" \
            --sport "${{ inputs.auction_sport || 'baseball' }}" \
            --dynamic-seed-limit "${{ inputs.dynamic_seed_limit || '50' }}" \
            --dynamic-seed-days "${{ inputs.dynamic_seed_days || '30' }}" \
            --max-discovery-candidates "${{ inputs.max_discovery_candidates || '100' }}" \
            2>&1 | tee "$LOG"

      - name: Upload auction logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-auction-logs
          path: /tmp/opportunity_auction.log
          if-no-files-found: ignore
          retention-days: 7

  verify-ce:
    name: CE identity verification
    needs: [opportunity-bin, opportunity-auction]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Verify top opportunities via CE
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          LOG=/tmp/ce_verify.log
          python3 scripts/verify_opportunities_ce.py \
            --limit 50 \
            --min-profit 10 \
            --cooldown 5 \
            2>&1 | tee "$LOG"

      - name: Upload CE verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ce-verify-logs
          path: /tmp/ce_verify.log
          if-no-files-found: ignore
          retention-days: 7
