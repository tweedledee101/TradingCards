name: Opportunity Pipeline

# Two jobs: BIN (SCP + eBay) then auction — each gets its own timeout and log artifact.
# Avoids one 120m monolith; auction still runs if BIN fails or times out (if: always).

on:
  schedule:
    - cron: '0 6,18 * * *'   # 6 AM + 6 PM UTC (2 AM + 2 PM ET)
  workflow_dispatch:
    inputs:
      players:
        description: 'Comma-separated player names (blank = top 40 by volume)'
        required: false
        default: ''
      max_budget:
        description: 'Max buy price'
        required: false
        default: '200'
      min_profit:
        description: 'Min profit after fees'
        required: false
        default: '10'
      min_roi:
        description: 'Min ROI %'
        required: false
        default: '20'
      min_scp_price:
        description: 'Min SCP price to consider'
        required: false
        default: '5'
      max_scp_price:
        description: 'Max SCP price'
        required: false
        default: '1000'
      sport:
        description: 'Discovery sport (Baseball, Basketball, Football, all)'
        required: false
        default: 'Baseball'
      dynamic_seed_limit:
        description: 'Merge top N players from DB sales into discovery (0=off)'
        required: false
        default: '50'
      dynamic_seed_days:
        description: 'Lookback days when ranking players from sales table'
        required: false
        default: '30'
      max_discovery_candidates:
        description: 'Max Browse discovery calls before ranking seeds'
        required: false
        default: '100'
      run_auction:
        description: 'Run auction job after BIN (uncheck = BIN only)'
        type: boolean
        required: false
        default: true
      auction_hours:
        description: 'Auctions ending within X hours (auction job)'
        required: false
        default: '48'
      auction_years:
        description: 'Auction years (comma-separated)'
        required: false
        default: '2023,2024,2025,2026'
      auction_sport:
        description: 'Auction sport'
        required: false
        default: 'baseball'

jobs:
  opportunity-bin:
    name: BIN (SCP + eBay)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install selenium

      - name: Install Firefox + geckodriver
        run: |
          sudo add-apt-repository -y ppa:mozillateam/ppa
          sudo apt-get update
          sudo apt-get install -y firefox-esr
          GECKO_VER="v0.36.0"
          curl -sL -o geckodriver.tar.gz "https://github.com/mozilla/geckodriver/releases/download/${GECKO_VER}/geckodriver-${GECKO_VER}-linux64.tar.gz"
          file geckodriver.tar.gz
          tar xzf geckodriver.tar.gz
          sudo mv geckodriver /usr/local/bin/
          rm geckodriver.tar.gz
          geckodriver --version
          firefox-esr --version

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 migrate.py --rds

      - name: Run BIN opportunity pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_APP_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          set -o pipefail
          LOG=/tmp/opportunity_bin.log
          ARGS=(
            python3 find_opportunities.py
            --skip-auction-chain
            --max-budget "${{ inputs.max_budget || '200' }}"
            --min-profit "${{ inputs.min_profit || '10' }}"
            --min-roi "${{ inputs.min_roi || '20' }}"
            --min-scp-price "${{ inputs.min_scp_price || '5' }}"
            --max-scp-price "${{ inputs.max_scp_price || '1000' }}"
          )
          if [ -n "${{ inputs.players }}" ]; then
            ARGS+=(--players "${{ inputs.players }}")
          fi
          ARGS+=(--sport "${{ inputs.sport || 'Baseball' }}")
          ARGS+=(--dynamic-seed-limit "${{ inputs.dynamic_seed_limit || '50' }}")
          ARGS+=(--dynamic-seed-days "${{ inputs.dynamic_seed_days || '30' }}")
          ARGS+=(--max-discovery-candidates "${{ inputs.max_discovery_candidates || '100' }}")
          "${ARGS[@]}" 2>&1 | tee "$LOG"

      - name: Upload BIN logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-bin-logs
          path: /tmp/opportunity_bin.log
          if-no-files-found: ignore
          retention-days: 7

  opportunity-auction:
    name: Auction (eBay-first)
    needs: [opportunity-bin]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.run_auction) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install selenium

      - name: Install Firefox + geckodriver
        run: |
          sudo add-apt-repository -y ppa:mozillateam/ppa
          sudo apt-get update
          sudo apt-get install -y firefox-esr
          GECKO_VER="v0.36.0"
          curl -sL -o geckodriver.tar.gz "https://github.com/mozilla/geckodriver/releases/download/${GECKO_VER}/geckodriver-${GECKO_VER}-linux64.tar.gz"
          file geckodriver.tar.gz
          tar xzf geckodriver.tar.gz
          sudo mv geckodriver /usr/local/bin/
          rm geckodriver.tar.gz
          geckodriver --version
          firefox-esr --version

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 migrate.py --rds

      - name: Run auction pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_APP_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CLIENT_SECRET }}
          SCP_PAGE_LOAD_TIMEOUT: "90"
        run: |
          set -o pipefail
          LOG=/tmp/opportunity_auction.log
          python3 find_auction_opportunities.py \
            --hours "${{ inputs.auction_hours || '48' }}" \
            --max-budget "${{ inputs.max_budget || '200' }}" \
            --min-profit "${{ inputs.min_profit || '10' }}" \
            --years "${{ inputs.auction_years || '2023,2024,2025,2026' }}" \
            --sport "${{ inputs.auction_sport || 'baseball' }}" \
            --dynamic-seed-limit "${{ inputs.dynamic_seed_limit || '50' }}" \
            --dynamic-seed-days "${{ inputs.dynamic_seed_days || '30' }}" \
            --max-discovery-candidates "${{ inputs.max_discovery_candidates || '100' }}" \
            2>&1 | tee "$LOG"

      - name: Upload auction logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-auction-logs
          path: /tmp/opportunity_auction.log
          if-no-files-found: ignore
          retention-days: 7
