<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ragnarok Gamez — Stream Border</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  .frame {
    position: absolute;
    inset: 0;
    box-sizing: border-box;
    border: 10px solid #e8590c;
    outline: 2px solid #0f1117;
    outline-offset: -14px;
  }

  .frame::before {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 60px rgba(232, 89, 12, 0.35);
    pointer-events: none;
  }

  .corner {
    position: absolute;
    width: 90px;
    height: 90px;
    border: 4px solid #ff6b1a;
  }
  .corner.tl { top: 18px; left: 18px; border-right: none; border-bottom: none; }
  .corner.tr { top: 18px; right: 18px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 18px; left: 18px; border-right: none; border-top: none; }
  .corner.br { bottom: 18px; right: 18px; border-left: none; border-top: none; }

  .badge {
    position: absolute;
    left: 32px;
    bottom: 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 22px 10px 10px;
    background: rgba(15, 17, 23, 0.85);
    border: 2px solid #e8590c;
    border-radius: 999px;
  }
  .badge img { width: 44px; height: 44px; border-radius: 50%; }
  .badge .word {
    color: #e8eaed;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 1px;
  }
  .badge .word span { color: #ff6b1a; }

  .handle {
    position: absolute;
    right: 32px;
    bottom: 28px;
    padding: 8px 18px;
    background: rgba(15, 17, 23, 0.85);
    border: 2px solid #2e3345;
    border-radius: 999px;
    color: #94a3b8;
    font-size: 20px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="badge">
    <img src="logo.png" alt="logo">
    <div class="word">RAGNAROK <span>GAMEZ</span></div>
  </div>

  <div class="handle">ragnarokgamez.com</div>
</body>
</html>
